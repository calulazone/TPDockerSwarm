name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            calulazone/tp-docker-swarm:latest
            calulazone/tp-docker-swarm:${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create Docker context
        run: |
          docker context create swarm --docker "host=ssh://vboxuser@${{ secrets.SSH_HOST }}"
          docker context use swarm

      - name: Deploy to Swarm
        run: |
          docker stack deploy \
            -c docker-stack.yml \
            --with-registry-auth \
            tp-swarm

      - name: Wait for deployment
        run: sleep 30

      - name: Check deployment status
        run: |
          echo "=== Services ==="
          docker service ls
          echo "=== Tasks ==="
          docker service ps tp-swarm_api
          echo "=== Logs ==="
          docker service logs tp-swarm_api --tail 20

      - name: Smoke test
        run: |
          echo "Running smoke test on remote VM..."
          response=$(ssh -o StrictHostKeyChecking=no vboxuser@${{ secrets.SSH_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health")
          echo "HTTP Response: $response"
          if [ "$response" -eq 200 ]; then
            echo "Smoke test passed: Service is UP"
          else
            echo "Smoke test failed: HTTP $response"
            exit 1
          fi